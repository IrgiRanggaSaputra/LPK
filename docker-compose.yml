services:
  # -------------------------------------------------------------
  # MySQL Database Service
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: lpk_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${DB_NAME:-lpk}
      MYSQL_USER: ${DB_USER:-lpkuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lpkpassword123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lpk_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # -------------------------------------------------------------
  # Backend Express API Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lpk_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-lpk}
      DB_USER: ${DB_USER:-lpkuser}
      DB_PASSWORD: ${DB_PASSWORD:-lpkpassword123}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-lpkadmin123}
      ADMIN_SESSION_TOKEN: ${ADMIN_SESSION_TOKEN:-lpk_secure_session_token_2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin_lpk@example.com}
      ADMIN_WA_NUMBER: ${ADMIN_WA_NUMBER:-6281234567890}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-your_email@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-your_app_password}
      BASE_URL: ${BASE_URL:-}
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - lpk_network

  # -------------------------------------------------------------
  # Frontend React (Vite + Nginx) Service
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: lpk_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - lpk_network

volumes:
  mysql_data:
    driver: local

networks:
  lpk_network:
    driver: bridge
